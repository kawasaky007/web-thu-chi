<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f3d2b" />
    <title>Đang offline · Thu Chi Gia Đình</title>
    <style>
      :root { color-scheme: light; font-family: ui-rounded, "Avenir Next", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; color: #0e0e0e; background: radial-gradient(circle at 15% 10%, #ffe62955, transparent 18rem), linear-gradient(145deg, #faf7f0, #edf0e7); }
      main { width: min(100%, 420px); padding: 28px; border: 1px solid #1f3d2b1f; border-radius: 32px; background: #fffcf7e8; box-shadow: 0 28px 80px #1f3d2b24; }
      .mark { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 18px; color: #ffe629; background: #1f3d2b; font-size: 26px; }
      p { color: #0e0e0e99; font-weight: 600; line-height: 1.65; }
      h1 { margin: 22px 0 8px; font-size: clamp(2rem, 10vw, 3.25rem); line-height: .95; letter-spacing: -.055em; }
      button { min-height: 48px; width: 100%; margin-top: 10px; border: 0; border-radius: 16px; color: #f5f1e8; background: #1f3d2b; font: inherit; font-weight: 800; cursor: pointer; }
      button:focus-visible { outline: 3px solid #5b5bd6; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">↯</div>
      <h1>Chưa có kết nối mạng.</h1>
      <p>Trang tài chính không được lưu vào cache để bảo vệ dữ liệu. Nếu biểu mẫu giao dịch đang mở, nháp vẫn được giữ trên thiết bị này.</p>
      <button type="button" onclick="window.location.reload()">Thử kết nối lại</button>
    </main>
  </body>
</html>
